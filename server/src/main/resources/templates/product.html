<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
    商品详情页
    数据来源：
      - GET /api/product/detail/{id}  商品详情
      - POST /api/cart                 加入购物车
    作者 zyr
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - zyr_shop 商城</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/common.js}"></script>
</head>
<body>
<header class="navbar">
    <div class="navbar-inner">
        <a class="navbar-brand" th:href="@{/}">
            <span class="logo"></span>
            <span>zyr_shop 商城</span>
        </a>
        <nav class="navbar-menu">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/cart}">购物车</a>
            <a th:href="@{/order}">我的订单</a>
            <a th:href="@{/chat}">智能客服</a>
        </nav>
        <div class="navbar-user" id="navbarUser"></div>
    </div>
</header>

<div class="container">
    <div class="product-detail" id="productDetail">
        <div class="empty">商品加载中...</div>
    </div>
</div>

<script>
    /** 商品 ID 来自 URL 末段 */
    const productId = location.pathname.split('/').pop();

    /**
     * 加载商品详情
     */
    async function loadProduct() {
        try {
            const p = await api('/api/product/detail/' + productId);
            document.getElementById('productDetail').innerHTML = `
                <div class="detail-image">
                    ${p.coverImage ? `<img src="${escapeHtml(p.coverImage)}" alt="${escapeHtml(p.name)}">` : '📦'}
                </div>
                <div class="detail-info">
                    <h1>${escapeHtml(p.name)}</h1>
                    <div class="detail-price">${formatPrice(p.price)}</div>
                    <div class="detail-meta">
                        库存：${p.stock || 0} 件　|　销量：${p.sales || 0} 件<br>
                        ${p.categoryName ? '分类：' + escapeHtml(p.categoryName) : ''}
                    </div>
                    <div class="detail-desc">${escapeHtml(p.description || '暂无描述')}</div>
                    <div>
                        数量：
                        <div class="quantity-picker">
                            <button onclick="changeQty(-1)">-</button>
                            <input id="qty" type="text" value="1" readonly>
                            <button onclick="changeQty(1)">+</button>
                        </div>
                        件
                    </div>
                    <div style="margin-top:24px;display:flex;gap:12px;">
                        <button class="btn btn-primary" onclick="addToCart(${p.id}, ${p.stock})">加入购物车</button>
                        <button class="btn btn-warning" onclick="buyNow(${p.id}, ${p.stock})">立即购买</button>
                        <a class="btn btn-default" href="/">返回</a>
                    </div>
                </div>
            `;
        } catch (e) {
            document.getElementById('productDetail').innerHTML = `
                <div class="empty" style="grid-column:1/-1">
                    <div class="icon">⚠️</div>
                    <div>${escapeHtml(e.message)}</div>
                    <a href="/" style="margin-top:12px;display:inline-block">返回首页</a>
                </div>`;
        }
    }

    /**
     * 修改数量（不能小于 1，不能超过库存）
     */
    function changeQty(delta) {
        const input = document.getElementById('qty');
        let v = parseInt(input.value || '1', 10) + delta;
        if (v < 1) v = 1;
        if (v > 99) v = 99;
        input.value = v;
    }

    /**
     * 加入购物车（需登录）
     */
    async function addToCart(productId, stock) {
        if (!requireLogin()) return;
        const qty = parseInt(document.getElementById('qty').value || '1', 10);
        if (qty > stock) { toast('库存不足', 'error'); return; }
        try {
            await api('/api/cart', {
                method: 'POST',
                body: JSON.stringify({ productId: productId, quantity: qty })
            });
            toast('已加入购物车', 'success');
        } catch (e) {
            toast(e.message || '加购失败', 'error');
        }
    }

    /**
     * 立即购买：先把商品加进购物车再跳结算
     * 简化方案：直接弹数量 → 加购 → 跳到 /checkout
     */
    async function buyNow(pid, stock) {
        if (!requireLogin()) return;
        const qty = parseInt(document.getElementById('qty').value || '1', 10);
        if (qty > stock) { toast('库存不足', 'error'); return; }
        try {
            await api('/api/cart', {
                method: 'POST',
                body: JSON.stringify({ productId: pid, quantity: qty })
            });
            location.href = '/checkout';
        } catch (e) {
            toast(e.message || '操作失败', 'error');
        }
    }

    // 复用 layout 的用户区渲染
    (async function renderUser() {
        const box = document.getElementById('navbarUser');
        const token = getToken();
        if (!token) { box.innerHTML = `<a href="/login">登录</a>`; return; }
        try {
            const user = await api('/api/auth/info');
            const nick = user.nickname || user.username || '用户';
            setCookie(NICKNAME_KEY, nick, 1);
            const initial = nick.charAt(0).toUpperCase();
            box.innerHTML = `
                <span class="avatar">${escapeHtml(initial)}</span>
                <span>${escapeHtml(nick)}</span>
                <button class="logout-btn" onclick="logout()">退出</button>
            `;
        } catch (e) {
            box.innerHTML = `<a href="/login">登录</a>`;
        }
    })();

    loadProduct();
</script>
</body>
</html>
