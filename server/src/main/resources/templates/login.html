<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
    用户登录页
    表单提交后调 /api/auth/login 拿到 token 与用户信息
    成功后写 cookie 并跳转首页
    作者 zyr
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - zyr_shop 商城</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/common.js}"></script>
</head>
<body>
<div class="login-wrapper">
    <div class="login-box">
        <h2>zyr_shop 商城</h2>
        <p class="subtitle">用户登录</p>
        <form id="loginForm" onsubmit="return doLogin(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>
        </form>
        <div class="tip">
            默认账号：<br>
            管理员 admin / 普通用户 zhangsan、lisi<br>
            密码均为 123456（MD5 加密）<br>
            管理员请访问 <a th:href="@{/}" style="color:#409eff">后台</a>，普通用户前台登录后可购物。
        </div>
    </div>
</div>

<script>
    /**
     * 处理登录：POST /api/auth/login，成功后写 cookie 跳首页
     */
    async function doLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中...';
        try {
            const body = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };
            const data = await api('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify(body)
            });
            // 写入 cookie：令牌与昵称各 1 天
            setCookie(TOKEN_KEY, data.token, 1);
            setCookie(NICKNAME_KEY, data.nickname || data.username, 1);
            toast('登录成功', 'success');
            // 管理员跳后台 Vue 客户端（5174 端口开发期），普通用户跳前台首页
            setTimeout(() => {
                if (data.role === 'ADMIN') {
                    location.href = 'http://localhost:5174/';
                } else {
                    location.href = '/';
                }
            }, 400);
        } catch (err) {
            toast(err.message || '登录失败', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '登 录';
        }
        return false;
    }

    // 已登录则直接跳首页
    if (isLoggedIn()) {
        location.href = '/';
    }
</script>
</body>
</html>
