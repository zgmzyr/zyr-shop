<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
    智能客服聊天窗（需登录）
    数据来源：
      - GET  /api/ai/chat?prompt=xxx&token=xxx  SSE 流式问答（EventSource 无法自定义请求头，所以 token 走 URL 参数）
    智能客服已做 RAG：基于知识库检索后由 deepseek 生成回答
    作者 zyr
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服 - zyr_shop 商城</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/common.js}"></script>
</head>
<body>
<header class="navbar">
    <div class="navbar-inner">
        <a class="navbar-brand" th:href="@{/}">
            <span class="logo"></span>
            <span>zyr_shop 商城</span>
        </a>
        <nav class="navbar-menu">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/cart}">购物车</a>
            <a th:href="@{/order}">我的订单</a>
            <a th:href="@{/chat}" class="active">智能客服</a>
        </nav>
        <div class="navbar-user" id="navbarUser"></div>
    </div>
</header>

<div class="container">
    <div class="chat-wrapper">
        <div class="chat-header">
            <span class="dot"></span>
            <span>zyr 智能客服（RAG 增强检索）</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg assistant">
                <div class="avatar">客</div>
                <div class="bubble">您好，我是 zyr_shop 商城智能客服，有什么可以帮您？商品咨询、订单售后、退换货等问题都可以问我。</div>
            </div>
        </div>
        <div class="chat-input">
            <textarea id="promptInput" placeholder="请输入您的问题，回车发送（Shift+Enter 换行）" autofocus></textarea>
            <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
</div>

<script>
    /** 当前 SSE 连接 */
    let eventSource = null;
    /** 是否正在回答 */
    let loading = false;

    /**
     * 发送一条消息（触发 SSE 流式问答）
     */
    function sendMessage() {
        if (loading) { toast('请等待当前回复完成', 'info'); return; }
        if (!requireLogin()) return;
        const input = document.getElementById('promptInput');
        const prompt = input.value.trim();
        if (!prompt) return;

        // 渲染用户消息气泡
        appendMsg('user', prompt);
        input.value = '';

        // 创建助手占位气泡，准备接收流式输出
        const bubble = appendMsg('assistant', '');
        loading = true;
        document.getElementById('sendBtn').disabled = true;

        // 通过 EventSource 建立 SSE 连接，token 走 URL 参数
        const url = '/api/ai/chat?prompt=' + encodeURIComponent(prompt) + '&token=' + encodeURIComponent(getToken());
        eventSource = new EventSource(url);

        let buffer = '';
        eventSource.onmessage = function (ev) {
            // 后端按行发送：data: <chunk>；以 [DONE] 结束
            if (ev.data === '[DONE]') {
                eventSource.close();
                eventSource = null;
                loading = false;
                document.getElementById('sendBtn').disabled = false;
                return;
            }
            buffer += ev.data;
            bubble.textContent = buffer;
            scrollBottom();
        };
        eventSource.onerror = function () {
            if (eventSource) { eventSource.close(); eventSource = null; }
            if (!bubble.textContent) {
                bubble.textContent = '（回复失败，请稍后重试）';
            }
            loading = false;
            document.getElementById('sendBtn').disabled = false;
        };
    }

    /**
     * 追加一条消息，返回 bubble DOM
     */
    function appendMsg(role, content) {
        const box = document.getElementById('chatMessages');
        const wrap = document.createElement('div');
        wrap.className = 'chat-msg ' + role;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '我' : '客';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = content;
        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        box.appendChild(wrap);
        scrollBottom();
        return bubble;
    }

    /** 滚动到底部 */
    function scrollBottom() {
        const box = document.getElementById('chatMessages');
        box.scrollTop = box.scrollHeight;
    }

    // 回车发送
    document.getElementById('promptInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 复用 layout 用户区
    (async function renderUser() {
        const box = document.getElementById('navbarUser');
        try {
            const user = await api('/api/auth/info');
            const nick = user.nickname || user.username || '用户';
            setCookie(NICKNAME_KEY, nick, 1);
            const initial = nick.charAt(0).toUpperCase();
            box.innerHTML = `
                <span class="avatar">${escapeHtml(initial)}</span>
                <span>${escapeHtml(nick)}</span>
                <button class="logout-btn" onclick="logout()">退出</button>
            `;
        } catch (e) {
            box.innerHTML = `<a href="/login">登录</a>`;
        }
    })();
</script>
</body>
</html>
