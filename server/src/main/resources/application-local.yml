# ===================================================================
# zyr_shop 支付宝沙箱【本地开发】配置文件
#
# 本文件随 profile=local 自动加载（application.yml 中已配置）
# 三个沙箱凭据从 Windows【用户环境变量】读取（你已配置好）：
#   ALIPAY_APP_ID            沙箱 APPID（如 9021000169609377）
#   ALIPAY_APP_PRIVATE_KEY   应用私钥（PKCS8，RSA2，纯 Base64 单行）
#   ALIPAY_PUBLIC_KEY        支付宝公钥（沙箱页面给出，纯 Base64 单行）
#
# 配置方式（已完成则无需操作）：
#   Windows → 设置 → 关于 → 高级系统设置 → 环境变量 → 用户变量 中新建上述 3 项
#   注意：配置/修改环境变量后，必须【重新启动】后端进程才会生效
#
# 沙箱控制台：https://open.alipay.com/develop/sandbox/app
#   - 接口加签方式选"公钥模式"（非证书模式）
#   - 应用私钥必须是 PKCS8（-----BEGIN PRIVATE KEY-----），不能是 PKCS1
#   - 沙箱买家账号在沙箱页"沙箱账号"处获取，用于登录沙箱页面付款
#
# 如不想用环境变量，也可直接把下方 ${...} 替换为字面值（请勿提交到公共仓库）
# @author zyr
# ===================================================================

zyr:
  alipay:
    # 从用户环境变量读取沙箱 APPID
    app-id: ${ALIPAY_APP_ID:}

    # 从用户环境变量读取应用私钥（程序会自动去除 PEM 头尾与换行，粘贴多行 PEM 亦可）
    app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}

    # 从用户环境变量读取支付宝公钥
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}

    # 新版沙箱网关（固定值）
    gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do

    # 支付完成后浏览器同步跳回的页面（商城订单页）
    return-url: http://localhost:8081/order

    # 支付宝服务器异步通知地址：
    #   - 必须是支付宝服务器可公网访问的地址，localhost 支付宝无法回调
    #   - 本地学习可用内网穿透（cpolar / natapp / ngrok）把本机 8081 暴露出去，
    #     再设到用户环境变量 ALIPAY_NOTIFY_URL，形如 http://xxxx.cpolar.top/api/payment/notify
    #   - 不配置穿透也能完成沙箱支付：付款成功后可在"我的订单"看到同步跳转，
    #     订单自动状态更新依赖此异步回调（学习阶段影响不大）
    notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8081/api/payment/notify}
